<!DOCTYPE html>
<html>
<head>
    <title>GUNA Chatbot</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Markdown -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <!-- Highlight.js -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

    <!-- PDF Export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #343541;
            color: white;
        }

        .layout {
            display: flex;
            height: 100vh;
        }

        .menu-toggle {
            position: fixed;
            top: 15px;
            left: 15px;
            background: #2a2b32;
            border: none;
            padding: 8px;
            border-radius: 6px;
            cursor: pointer;
            color: white;
            z-index: 1000;
        }

        .sidebar {
            width: 260px;
            background: #1e1f23;
            padding: 15px;
            transition: 0.3s ease;
            overflow-y: auto;
        }

        .collapsed {
            width: 0 !important;
            padding: 0 !important;
            overflow: hidden;
        }

        .sidebar button, .sidebar select {
            width: 100%;
            margin-bottom: 8px;
            padding: 8px;
            background: #2a2b32;
            border: none;
            color: white;
            border-radius: 6px;
            cursor: pointer;
        }

        .chat-item {
            display: flex;
            gap: 5px;
            margin-bottom: 6px;
            position: relative;
        }

        .chat-item button:first-child {
            flex: 1;
            text-align: left;
        }

        .active-chat {
            background: #10a37f !important;
        }

        .dropdown-menu {
            position: absolute;
            right: 0;
            top: 35px;
            background: #2a2b32;
            border-radius: 6px;
            display: none;
            min-width: 120px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
        }

        .dropdown-menu div {
            padding: 8px;
            cursor: pointer;
        }

        .dropdown-menu div:hover {
            background: #3a3b42;
        }

        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .chat-box {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            line-height: 1.6;
        }

        .message {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 12px;
            max-width: 75%;
            white-space: pre-wrap;
        }

        .user {
            margin-left: auto;
            background: #10a37f;
        }

        .bot {
            margin-right: auto;
            background: #444654;
        }

        pre {
            background: #1e1f23;
            padding: 10px;
            border-radius: 6px;
            overflow-x: auto;
        }

        .code-wrapper {
            position: relative;
        }

        .copy-btn {
            position: absolute;
            top: 6px;
            right: 6px;
            background: #10a37f;
            border: none;
            padding: 4px 8px;
            font-size: 12px;
            border-radius: 4px;
            cursor: pointer;
            color: white;
        }

        .input-area {
            display: flex;
            padding: 10px;
            background: #40414f;
        }

        .input-area input {
            flex: 1;
            padding: 8px;
            border-radius: 6px;
            border: none;
        }

        .input-area button {
            margin-left: 8px;
            padding: 8px 15px;
            border-radius: 6px;
            border: none;
            background: #10a37f;
            color: white;
        }
    </style>
</head>

<body>

<button class="menu-toggle" onclick="toggleSidebar()">☰</button>

<div class="layout">

    <div class="sidebar" id="sidebar">
        <button onclick="createNewChat()">➕ New Chat</button>
        <button onclick="exportPDF()">📄 Export Chat</button>

        <select id="personality" onchange="savePersonality()">
            <option value="You are a helpful AI assistant.">Default</option>
            <option value="You are a friendly teacher.">Teacher</option>
            <option value="You are a strict coding mentor.">Coding Mentor</option>
            <option value="You are a motivational coach.">Motivator</option>
        </select>

        <div id="chatList"></div>
    </div>

    <div class="chat-container">
        <div id="chat-box" class="chat-box"></div>

        <div class="input-area">
            <input id="message" placeholder="Type message...">
            <button onclick="sendMessage()">Send</button>
        </div>
    </div>

</div>

<script>
let conversations = JSON.parse(localStorage.getItem("conversations")) || [];
let currentChatId = null;

window.onload = function () {
    if (conversations.length === 0) createNewChat();
    renderSidebar();
    loadChat(conversations[0].id);
};

function toggleSidebar() {
    document.getElementById("sidebar").classList.toggle("collapsed");
}

function createNewChat() {
    const chat = {
        id: Date.now(),
        title: "New Chat",
        personality: "You are a helpful AI assistant.",
        messages: []
    };
    conversations.unshift(chat);
    currentChatId = chat.id;
    save();
    renderSidebar();
    renderMessages();
}

function getCurrentChat() {
    return conversations.find(c => c.id === currentChatId);
}

function loadChat(id) {
    currentChatId = id;
    const chat = getCurrentChat();
    document.getElementById("personality").value = chat.personality;
    renderSidebar();
    renderMessages();
}

function renderMessages() {
    const box = document.getElementById("chat-box");
    box.innerHTML = "";
    const chat = getCurrentChat();
    chat.messages.forEach(msg => {
        addMessage(msg.role === "assistant" ? "bot" : "user", msg.content);
    });
}

function addMessage(role, text) {
    const div = document.createElement("div");
    div.classList.add("message", role);

    if (role === "bot") {
        div.innerHTML = marked.parse(text);
        setTimeout(() => {
            hljs.highlightAll();
            addCopyButtons();
        }, 0);
    } else {
        div.innerText = text;
    }

    document.getElementById("chat-box").appendChild(div);
    document.getElementById("chat-box").scrollTop =
        document.getElementById("chat-box").scrollHeight;
}

function addCopyButtons() {
    document.querySelectorAll("pre").forEach(pre => {
        if (pre.parentElement.classList.contains("code-wrapper")) return;

        const wrapper = document.createElement("div");
        wrapper.classList.add("code-wrapper");
        pre.parentNode.insertBefore(wrapper, pre);
        wrapper.appendChild(pre);

        const btn = document.createElement("button");
        btn.innerText = "Copy";
        btn.classList.add("copy-btn");

        btn.onclick = () => {
            navigator.clipboard.writeText(pre.innerText);
            btn.innerText = "Copied!";
            setTimeout(() => btn.innerText = "Copy", 1500);
        };

        wrapper.appendChild(btn);
    });
}

async function sendMessage() {
    const input = document.getElementById("message");
    const message = input.value.trim();
    if (!message) return;

    const chat = getCurrentChat();

    if (chat.messages.length === 0)
        chat.title = message.substring(0, 20);

    addMessage("user", message);
    chat.messages.push({ role: "user", content: message });
    save();
    input.value = "";

    const response = await fetch("/chat", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
            history: [
                { role: "system", content: chat.personality },
                ...chat.messages
            ]
        })
    });

    const data = await response.json();

    chat.messages.push({ role: "assistant", content: data.reply });
    save();
    addMessage("bot", data.reply);

    renderSidebar();
}

function exportPDF() {
    const element = document.getElementById("chat-box");
    html2pdf().from(element).save("chat-export.pdf");
}

function savePersonality() {
    const chat = getCurrentChat();
    chat.personality = document.getElementById("personality").value;
    save();
}

function renderSidebar() {
    const list = document.getElementById("chatList");
    list.innerHTML = "";
    conversations.forEach(chat => {
        const btn = document.createElement("button");
        btn.innerText = chat.title;
        btn.onclick = () => loadChat(chat.id);
        if (chat.id === currentChatId)
            btn.classList.add("active-chat");
        list.appendChild(btn);
    });
}

function save() {
    localStorage.setItem("conversations", JSON.stringify(conversations));
}
</script>

</body>
</html>
